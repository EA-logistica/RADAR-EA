services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    environment: &radar_environment
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar_local}@db:5432/radar
      RAW_DIR: /app/data/raw
      API_TOKEN: ${API_TOKEN:-}
      ALERT_PRICE_PERCENT: ${ALERT_PRICE_PERCENT:-20}
      ALERT_VOLUME_PERCENT: ${ALERT_VOLUME_PERCENT:-30}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *radar_environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - raw_data:/app/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    environment: *radar_environment
    command: ["python", "-m", "radar.worker"]
    volumes:
      - raw_data:/app/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  raw_data:
