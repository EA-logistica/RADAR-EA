[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-importaciones"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "beautifulsoup4>=4.13,<5", "playwright>=1.50,<2", "httpx>=0.28,<1", "openpyxl>=3.1,<4", "pycountry>=24", "dbfread==2.0.7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
